[Unit]
Description=Syncthing (custom)
RequiresMountsFor=/mnt/syncmerg /mnt/nvme/sync
BindsTo=mergsync.service
Requisite=mergsync.service
After=mergsync.service network-online.target
StartLimitIntervalSec=60
StartLimitBurst=3


[Service]
SyslogIdentifier=Syncthing

User=syncthing
UMask=002
ExecStart=
ExecStart=/opt/syncthing/syncthing --no-browser --no-restart --log-level=WARN --home=/mnt/dietpi_userdata/syncthing
Restart=on-failure
RestartSec=1
SuccessExitStatus=3 4
RestartForceExitStatus=3 4

# Hardening
ProtectSystem=full
PrivateTmp=true
SystemCallArchitectures=native
MemoryDenyWriteExecute=true
NoNewPrivileges=true
#ProtectSystem=strict
#ProtectHome=true
#PrivateDevices=true
#ProtectKernelTunables=true
#ProtectControlGroups=true
#ReadWritePaths=-/mnt/syncmerg -/mnt/dietpi_userdata/syncthing -/mnt/dietpi_userdata/sync

[Install]
WantedBy=multi-user.target
